<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EKSAMEN PREP</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<!-- FIX: marked.js erstatter hjemmelavet renderMD() -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
:root{--bg:#080b14;--bg2:#0d1220;--surface:#111827;--surface2:#1a2235;--border:#1e2d47;--border2:#253652;--accent:#3b82f6;--accent2:#60a5fa;--glow:rgba(59,130,246,0.15);--text:#e2e8f0;--text2:#94a3b8;--muted:#4b6080;--success:#10b981;--danger:#ef4444;--warn:#f59e0b;--mono:'JetBrains Mono',monospace;--sans:'Outfit',sans-serif;}
[data-theme="light"]{--bg:#f0f4ff;--bg2:#e8edf8;--surface:#fff;--surface2:#f1f5fb;--border:#dce3f0;--border2:#c8d3e8;--accent:#2563eb;--accent2:#3b82f6;--glow:rgba(37,99,235,0.1);--text:#0f172a;--text2:#475569;--muted:#94a3b8;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;transition:background .3s,color .3s;}
header{display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:56px;border-bottom:1px solid var(--border);background:rgba(8,11,20,0.9);backdrop-filter:blur(12px);position:sticky;top:0;z-index:100;}
[data-theme="light"] header{background:rgba(240,244,255,0.9);}
.logo{font-family:var(--mono);font-size:.9rem;font-weight:700;color:var(--accent2);display:flex;align-items:center;gap:8px;}
.logo-dot{width:7px;height:7px;background:var(--success);border-radius:50%;box-shadow:0 0 8px var(--success);animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.hbtn{background:var(--surface2);border:1px solid var(--border);color:var(--text2);padding:5px 12px;border-radius:7px;cursor:pointer;font-family:var(--mono);font-size:.7rem;transition:all .2s;}
.hbtn:hover{border-color:var(--accent);color:var(--accent2);}
.app{display:grid;grid-template-columns:280px 1fr;height:calc(100vh - 56px);}
.sidebar{border-right:1px solid var(--border);background:var(--bg2);display:flex;flex-direction:column;overflow:hidden;}
.sidebar-section{padding:14px 14px 10px;border-bottom:1px solid var(--border);}
.slabel{font-family:var(--mono);font-size:.62rem;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin-bottom:8px;}
.sub-list{display:flex;flex-direction:column;gap:3px;}
.sub-btn{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;cursor:pointer;border:1px solid transparent;background:transparent;color:var(--text2);font-family:var(--sans);font-size:.85rem;font-weight:500;transition:all .2s;width:100%;text-align:left;}
.sub-btn:hover{background:var(--surface);color:var(--text);border-color:var(--border);}
.sub-btn.active{background:var(--glow);color:var(--accent2);border-color:var(--accent);}
.sub-icon{font-size:.95rem;}
.sub-count{margin-left:auto;font-family:var(--mono);font-size:.65rem;color:var(--muted);background:var(--surface2);padding:1px 6px;border-radius:8px;}
.sub-btn.active .sub-count{background:rgba(59,130,246,.2);color:var(--accent2);}
.sidebar-docs{flex:1;overflow-y:auto;padding:12px 14px;}
.sidebar-docs::-webkit-scrollbar{width:3px;}
.sidebar-docs::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
.upload-zone{border:1.5px dashed var(--border2);border-radius:9px;padding:14px;text-align:center;cursor:pointer;position:relative;transition:all .2s;margin-bottom:10px;}
.upload-zone:hover,.upload-zone.dragover{border-color:var(--accent);background:var(--glow);}
.upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.uz-icon{font-size:1.2rem;margin-bottom:3px;}
.uz-text{font-size:.75rem;color:var(--text2);}
.uz-text strong{color:var(--accent2);}
.doc-items{display:flex;flex-direction:column;gap:5px;}
.doc-card{display:flex;align-items:center;gap:7px;padding:7px 9px;background:var(--surface);border:1px solid var(--border);border-radius:7px;transition:all .2s;}
.doc-card:hover{border-color:var(--border2);}
.doc-card.selected{border-color:var(--accent);background:var(--glow);}
.doc-icon{font-size:.9rem;flex-shrink:0;}
.doc-info{flex:1;min-width:0;}
.doc-name{font-size:.75rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);}
.doc-meta{font-family:var(--mono);font-size:.6rem;color:var(--muted);margin-top:1px;}
.doc-del{background:none;border:none;color:var(--muted);cursor:pointer;padding:2px 4px;border-radius:3px;font-size:.75rem;transition:all .15s;flex-shrink:0;}
.doc-del:hover{color:var(--danger);background:rgba(239,68,68,.1);}
.empty-docs{text-align:center;padding:20px 10px;color:var(--muted);font-size:.78rem;}
.sidebar-saved{padding:10px 14px 14px;border-top:1px solid var(--border);}
.saved-list{display:flex;flex-direction:column;gap:4px;max-height:160px;overflow-y:auto;}
.saved-card{display:flex;align-items:center;gap:7px;padding:6px 9px;background:var(--surface);border:1px solid var(--border);border-radius:7px;cursor:pointer;transition:all .2s;}
.saved-card:hover{border-color:var(--accent);background:var(--glow);}
.saved-card-icon{font-size:.85rem;}
.saved-card-info{flex:1;min-width:0;}
.saved-card-type{font-size:.73rem;font-weight:600;color:var(--text2);}
.saved-card-sub{font-family:var(--mono);font-size:.6rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.saved-del{background:none;border:none;color:var(--muted);cursor:pointer;padding:2px 4px;border-radius:3px;font-size:.72rem;}
.saved-del:hover{color:var(--danger);}
.main{display:flex;flex-direction:column;overflow:hidden;}
.main-topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;border-bottom:1px solid var(--border);background:var(--bg2);gap:12px;flex-wrap:wrap;}
.scope-tabs{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;padding:3px;gap:3px;}
.scope-btn{padding:5px 14px;border:none;background:transparent;color:var(--text2);font-family:var(--sans);font-size:.8rem;font-weight:500;border-radius:5px;cursor:pointer;transition:all .2s;white-space:nowrap;}
.scope-btn:hover{color:var(--text);background:var(--surface2);}
.scope-btn.active{background:var(--accent);color:#fff;box-shadow:0 2px 10px rgba(59,130,246,.35);}
.stats-pill{font-family:var(--mono);font-size:.68rem;color:var(--text2);background:var(--surface);border:1px solid var(--border);padding:4px 10px;border-radius:20px;}
.stats-pill span{color:var(--success);}
.mode-tabs{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;padding:3px;gap:3px;}
.mode-btn{flex:1;padding:6px 12px;border:none;background:transparent;color:var(--text2);font-family:var(--sans);font-size:.8rem;font-weight:500;border-radius:5px;cursor:pointer;transition:all .2s;white-space:nowrap;}
.mode-btn:hover{color:var(--text);background:var(--surface2);}
.mode-btn.active{background:var(--accent);color:#fff;box-shadow:0 2px 10px rgba(59,130,246,.35);}
.main-body{flex:1;overflow-y:auto;padding:20px 24px;}
.main-body::-webkit-scrollbar{width:5px;}
.main-body::-webkit-scrollbar-thumb{background:var(--border2);border-radius:5px;}
.controls-row{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
.ctrl-group{display:flex;align-items:center;gap:7px;}
.ctrl-label{font-size:.78rem;color:var(--text2);}
.ctrl-select{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:7px;font-family:var(--sans);font-size:.8rem;}
.topic-input{flex:1;min-width:180px;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:7px 12px;border-radius:7px;font-family:var(--sans);font-size:.82rem;}
.topic-input:focus{outline:none;border-color:var(--accent);}
.scope-info{font-family:var(--mono);font-size:.7rem;color:var(--accent2);background:var(--glow);border:1px solid var(--accent);padding:5px 12px;border-radius:6px;}
.gen-btn{background:var(--accent);border:none;color:#fff;padding:8px 24px;border-radius:8px;cursor:pointer;font-family:var(--mono);font-size:.75rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;transition:all .2s;box-shadow:0 3px 16px rgba(59,130,246,.3);margin-left:auto;}
.gen-btn:hover{background:#2563eb;transform:translateY(-1px);}
.gen-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none;}
.quiz-stats-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:16px;flex-wrap:wrap;gap:8px;}
.quiz-stats-bar .qs-left{display:flex;align-items:center;gap:12px;}
.quiz-stats-bar .qs-count{font-family:var(--mono);font-size:.78rem;color:var(--success);}
/* FIX: Score display */
.score-display{font-family:var(--mono);font-size:.78rem;color:var(--accent2);background:rgba(59,130,246,.1);border:1px solid var(--accent);padding:3px 10px;border-radius:6px;display:none;}
.score-display.visible{display:inline-block;}
.quiz-stats-bar .qs-actions{display:flex;gap:8px;}
.qsbtn{background:var(--surface2);border:1px solid var(--border);color:var(--text2);padding:5px 12px;border-radius:6px;cursor:pointer;font-size:.76rem;transition:all .2s;}
.qsbtn:hover{border-color:var(--accent);color:var(--accent2);}
.qsbtn.add{border-color:var(--success);color:var(--success);}
.qsbtn.add:hover{background:rgba(16,185,129,.1);}
.loading-bar{display:none;align-items:center;gap:12px;padding:16px 20px;background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:16px;}
.loading-bar.visible{display:flex;}
.spinner{width:18px;height:18px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-txt{font-family:var(--mono);font-size:.72rem;color:var(--text2);}
.output-wrap{display:none;}
.output-wrap.visible{display:block;}
.output-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.output-label{font-family:var(--mono);font-size:.7rem;letter-spacing:.15em;color:var(--accent2);text-transform:uppercase;}
.output-btns{display:flex;gap:7px;}
.obtn{background:var(--surface2);border:1px solid var(--border);color:var(--text2);padding:5px 12px;border-radius:6px;cursor:pointer;font-size:.76rem;transition:all .2s;}
.obtn:hover{border-color:var(--accent);color:var(--accent2);}
.quiz-grid{display:flex;flex-direction:column;gap:14px;}
.quiz-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;animation:up .3s ease;}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.quiz-num{font-family:var(--mono);font-size:.62rem;color:var(--accent2);margin-bottom:6px;letter-spacing:.12em;text-transform:uppercase;}
.quiz-q{font-weight:600;font-size:.93rem;line-height:1.55;margin-bottom:12px;}
.quiz-opts{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
@media(max-width:860px){.quiz-opts{grid-template-columns:1fr;}}
.quiz-opt{padding:9px 13px;border-radius:8px;border:1px solid var(--border);cursor:pointer;font-size:.83rem;background:var(--surface2);color:var(--text);text-align:left;transition:all .15s;line-height:1.4;}
.quiz-opt:hover:not(:disabled){border-color:var(--accent);color:var(--accent2);background:var(--glow);}
.quiz-opt.correct{border-color:var(--success)!important;background:rgba(16,185,129,.12)!important;color:var(--success)!important;}
.quiz-opt.wrong{border-color:var(--danger)!important;background:rgba(239,68,68,.1)!important;color:var(--danger)!important;}
.quiz-opt:disabled{cursor:default;}
.quiz-reveal{margin-top:10px;padding:10px 14px;background:var(--bg2);border-left:3px solid var(--accent);border-radius:0 7px 7px 0;font-size:.8rem;color:var(--text2);display:none;line-height:1.55;}
.quiz-reveal.visible{display:block;}
/* FIX: marked.js styling for md output */
.md-out{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:26px 30px;font-size:.9rem;line-height:1.8;color:var(--text);}
.md-out h1{font-size:1.3rem;font-weight:700;margin-bottom:14px;color:var(--accent2);border-bottom:1px solid var(--border);padding-bottom:8px;}
.md-out h2{font-size:1.05rem;font-weight:600;margin:20px 0 8px;color:var(--text);}
.md-out h3{font-size:.93rem;font-weight:600;margin:14px 0 6px;color:var(--text2);}
.md-out p{margin-bottom:10px;}
.md-out ul,.md-out ol{padding-left:18px;margin-bottom:10px;}
.md-out li{margin-bottom:4px;}
.md-out strong{color:var(--accent2);font-weight:600;}
.md-out em{color:var(--text2);font-style:italic;}
.md-out code{background:var(--surface2);border:1px solid var(--border);padding:1px 6px;border-radius:4px;font-family:var(--mono);font-size:.8rem;color:var(--warn);}
.md-out pre{background:var(--bg2);border:1px solid var(--border);padding:14px;border-radius:8px;overflow-x:auto;margin-bottom:12px;}
.md-out pre code{background:none;border:none;padding:0;color:var(--text2);}
.md-out hr{border:none;border-top:1px solid var(--border);margin:16px 0;}
.toast{position:fixed;bottom:20px;right:20px;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:10px 18px;border-radius:9px;font-size:.8rem;opacity:0;transition:opacity .3s;z-index:999;box-shadow:0 6px 24px rgba(0,0,0,.3);}
.toast.visible{opacity:1;}
.toast.success{border-color:var(--success);}
.toast.error{border-color:var(--danger);}

/* ADMIN-ONLY ELEMENTS */
.admin-only{display:none!important;}
body.admin-active .admin-only{display:block!important;}
body.admin-active .qs-admin-btns{display:inline-flex!important;gap:8px;}
body.admin-active .upload-zone{display:flex!important;}

/* LOGIN OVERLAY */
#loginOverlay{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:1.5rem;}
#loginOverlay.hidden{display:none;}
.login-box{background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:2rem 2.5rem;display:flex;flex-direction:column;gap:1rem;min-width:300px;max-width:400px;width:90%;}
.login-title{font-family:var(--mono);font-size:1.1rem;font-weight:700;color:var(--accent2);text-align:center;}
.login-sub{font-size:.8rem;color:var(--muted);text-align:center;}
.login-input{background:var(--bg2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.9rem;padding:.6rem 1rem;outline:none;width:100%;box-sizing:border-box;}
.login-input:focus{border-color:var(--accent);}
.login-btn{background:var(--accent2);color:#000;border:none;border-radius:8px;padding:.65rem;font-weight:700;font-family:var(--mono);font-size:.85rem;cursor:pointer;letter-spacing:.08em;}
.login-btn:hover{opacity:.85;}
.login-error{color:var(--danger);font-size:.75rem;text-align:center;min-height:1em;}
.admin-badge{background:rgba(245,158,11,.15);color:#f59e0b;border:1px solid rgba(245,158,11,.3);border-radius:6px;font-size:.7rem;font-weight:700;padding:2px 8px;font-family:var(--mono);margin-left:8px;}

/* RESPONSIVE DESIGN */
@media(max-width:768px){
  .app{grid-template-columns:1fr;height:auto;}
  .sidebar{border-right:none;border-bottom:1px solid var(--border);width:100%;overflow-x:auto;}
  .sidebar-section{padding:10px 12px 8px;}
  .sub-list{flex-direction:row;flex-wrap:wrap;gap:4px;}
  .sub-btn{padding:6px 10px;font-size:.72rem;}
  .doc-items{max-height:180px;overflow-y:auto;}
  .content{padding:12px;}
  .top-bar{flex-wrap:wrap;gap:6px;}
  .scope-btns{flex-wrap:wrap;}
  .mode-btns{flex-wrap:wrap;}
  header{padding:0 14px;height:48px;}
}
@media(max-width:480px){
  .login-box{padding:1.5rem 1.2rem;}
  .quiz-card{padding:14px 16px;}
  .option-btn{padding:10px 12px;font-size:.82rem;}
  .output-area{padding:12px;}
  .top-bar{gap:4px;}
  .gen-btn{padding:8px 12px;font-size:.8rem;}
}
</style>
</head>
<body>
<div id="loginOverlay">
  <div class="logo"><div class="logo-dot"></div>EKSAMEN PREP</div>
  <div class="login-box">
    <div class="login-title">Log ind</div>
    <div class="login-sub">Skriv din adgangskode for at fortsætte</div>
    <input id="loginInput" class="login-input" type="password" placeholder="Adgangskode ...">
    <div id="loginError" class="login-error"></div>
    <button class="login-btn" onclick="doLogin()">LOG IND</button>
  </div>
</div>
<header>
  <div class="logo"><div class="logo-dot"></div>EXAM.PREP</div>
  <button class="hbtn" onclick="toggleTheme()" id="themeBtn">☀ LYS</button>
</header>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="slabel">// fag</div>
      <div class="sub-list">
        <button class="sub-btn active" onclick="selectSubject(this,'Programmering')"><span class="sub-icon">💻</span>Programmering<span class="sub-count" id="cnt-0">0</span></button>
        <button class="sub-btn" onclick="selectSubject(this,'Forretningsforståelse')"><span class="sub-icon">📊</span>Forretningsforståelse<span class="sub-count" id="cnt-1">0</span></button>
        <button class="sub-btn" onclick="selectSubject(this,'Computerarkitektur')"><span class="sub-icon">🖥</span>Computerarkitektur<span class="sub-count" id="cnt-2">0</span></button>
      </div>
    </div>
    <div class="sidebar-docs" id="sidebarDocs">
      <div class="upload-zone admin-only" id="uploadZone"
        ondragover="event.preventDefault();this.classList.add('dragover')"
        ondragleave="this.classList.remove('dragover')"
        ondrop="handleDrop(event)">
        <input type="file" id="fileInput" multiple accept=".pdf,.pptx,.ppt,.docx,.doc,.txt,.md" onchange="handleFiles(this.files)">
        <div class="uz-icon">📂</div>
        <div class="uz-text">Træk filer hertil eller <strong>klik</strong></div>
      </div>
      <div class="doc-items" id="docItems"><div class="empty-docs">Ingen dokumenter endnu</div></div>
    </div>
    <div class="sidebar-saved">
      <div class="slabel" style="margin-bottom:8px;">// gemte resultater</div>
      <div class="saved-list" id="savedList"><div class="empty-docs" style="padding:8px 0;">Ingen gemte resultater</div></div>
    </div>
  </aside>

  <div class="main">
    <div class="main-topbar">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <div class="scope-tabs">
          <button class="scope-btn active" onclick="selectScope(this,'all')">📚 Alle filer</button>
          <button class="scope-btn" onclick="selectScope(this,'single')">📄 Enkelt fil</button>
        </div>
        <div class="stats-pill" id="statsPill"><span>0</span> dokumenter</div>
      </div>
      <div class="mode-tabs">
        <button class="mode-btn active" onclick="selectMode(this,'quiz')">🎯 Quiz</button>
        <button class="mode-btn" onclick="selectMode(this,'summary')">📋 Opsummering</button>
        <button class="mode-btn" onclick="selectMode(this,'explain')">💡 Forklaring</button>
      </div>
    </div>

    <div class="main-body">
      <div class="controls-row" id="controlsRow">
        <div class="ctrl-group" id="quizCtrls" style="display:none;">
          <span class="ctrl-label">Type:</span>
          <select class="ctrl-select" id="qType">
            <option value="multiple">Multiplechoice</option>
            <option value="open">Åbne spørgsmål</option>
            <option value="truefalse">Sandt/Falsk</option>
          </select>
        </div>
        <input type="text" class="topic-input" id="topicInput" placeholder="Skriv emne at forklare (fx 'OOP', 'Loops', 'OSI-modellen')..." style="display:none;">
        <div class="scope-info" id="scopeInfo" style="display:none;">📄 Enkelt fil valgt</div>
        <button class="gen-btn" id="genBtn" onclick="generate()" style="display:none;">⚡ GENERÉR</button>
      </div>

      <!-- Quiz spørgsmål bank -->
      <div id="quizBank" style="display:none;">
        <div class="quiz-stats-bar">
          <div class="qs-left">
            <span class="qs-count" id="qsCount">0 spørgsmål gemt</span>
            <!-- FIX: Score tracker -->
            <span class="score-display" id="scoreDisplay"></span>
          </div>
          <div class="qs-actions">
            <div class="admin-only qs-admin-btns">
              <button class="qsbtn add" onclick="generate()">➕ Tilføj 5 nye</button>
              <button class="qsbtn" onclick="clearQuestions()" style="border-color:var(--danger);color:var(--danger);">🗑 Slet alle</button>
            </div>
            <button class="qsbtn" onclick="startQuiz()">🎯 Tag quiz</button>
          </div>
        </div>
      </div>

async function sb(path, opts = {}) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...opts,
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation',
      ...opts.headers
    }
  });
  if (!r.ok) {
    const errText = await r.text();
    // FIX: Bedre fejlbesked hvis tabel mangler
    if (errText.includes('relation') || errText.includes('does not exist')) {
      throw new Error('Supabase-tabel mangler — tjek at alle tabeller er oprettet i dit dashboard');
    }
    throw new Error(errText);
  }
  const t = await r.text();
  return t ? JSON.parse(t) : [];
}

function handleDrop(e) { e.preventDefault(); document.getElementById('uploadZone').classList.remove('dragover'); handleFiles(e.dataTransfer.files); }

async function handleFiles(files) {
  for (const file of files) {
    const ext = file.name.split('.').pop().toLowerCase();
    let text = '';
    try {
      if (ext === 'pdf') text = await readPDF(file);
      else if (['docx','doc'].includes(ext)) text = await readDOCX(file);
      else if (['pptx','ppt'].includes(ext)) text = await readPPTX(file);
      else if (['txt','md'].includes(ext)) text = await readTxt(file);
      else { showToast('Ukendt type: ' + file.name, 'error'); continue; }
      if (!text || text.length < 10) { showToast('Ingen tekst: ' + file.name, 'error'); continue; }
      // FIX: Trim dokumentindhold til 20.000 tegn pr. fil for at spare tokens
      if (text.length > 20000) {
        text = text.slice(0, 20000) + '\n\n[Afkortet — upload kortere uddrag for bedre resultater]';
      }
      const res = await sb('documents', { method: 'POST', body: JSON.stringify({ subject: currentSubject, filename: file.name, content: text }) });
      if (!allDocs[currentSubject]) allDocs[currentSubject] = [];
      allDocs[currentSubject].push(res[0]);
      document.getElementById(`cnt-${SUBJECTS.indexOf(currentSubject)}`).textContent = allDocs[currentSubject].length;
      renderDocs(); updateStats();
      showToast('✓ ' + file.name, 'success');
    } catch(e) { showToast('Fejl: ' + e.message, 'error'); }
  }
}

async function readPDF(file) {
  const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  let t = '';
  for (let i = 1; i <= pdf.numPages; i++) { const p = await pdf.getPage(i); const c = await p.getTextContent(); t += c.items.map(x=>x.str).join(' ') + '\n'; }
  return t.trim();
}
async function readDOCX(file) { return (await mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() })).value.trim(); }
async function readPPTX(file) {
  const zip = await JSZip.loadAsync(await file.arrayBuffer());
  const slides = Object.keys(zip.files).filter(n=>n.match(/^ppt\/slides\/slide\d+\.xml$/)).sort((a,b)=>parseInt(a.match(/\d+/)?.[0]||0)-parseInt(b.match(/\d+/)?.[0]||0));
  let t = '';
  for (const s of slides) { const xml = await zip.files[s].async('text'); const st = (xml.match(/<a:t[^>]*>([^<]+)<\/a:t>/g)||[]).map(m=>m.replace(/<[^>]+>/g,'')).join(' ').trim(); if (st) t += st + '\n'; }
  return t.trim();
}
async function readTxt(file) { return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=e=>res(e.target.result); r.onerror=rej; r.readAsText(file); }); }

// FIX PERMANENT: Bruger data-attributter - immune mod quotes i explanation tekst
function handleDBAnswer(el) {
  const card = el.closest('.quiz-card');
  if (card.querySelector('.correct,.wrong')) return;

  const letter = el.dataset.letter;
  const correct = el.dataset.correct;
  const isCorrect = letter === correct;

  card.querySelectorAll('.quiz-opt').forEach(o => {
    const l = o.dataset.letter;
    if (!l) return;
    if (l === letter && !isCorrect) o.classList.add('wrong');
    if (l === correct) o.classList.add('correct');
    o.disabled = true;
  });

  const reveal = card.querySelector('.quiz-reveal');
  if (reveal) reveal.classList.add('visible');

  if (isCorrect) quizScore++;
  quizAnswered++;
  updateScoreDisplay();
}

function buildPrompt() {
  const docs = allDocs[currentSubject]||[];
  let useDocs = currentScope === 'single' && selectedDocId ? docs.filter(d=>d.id===selectedDocId) : docs;
  let parts = '';
  for (const d of useDocs) parts += `\n\n--- ${d.filename} ---\n${d.content||''}`;
  const scopeLabel = currentScope === 'single' && selectedDocId ? `filen "${useDocs[0]?.filename}"` : `alle filer i "${currentSubject}"`;
  const mat = parts ? `Undervisningsmateriale fra ${scopeLabel}:\n${parts}` : `Brug din viden om "${currentSubject}".`;
  const topic = document.getElementById('topicInput').value||'';
  if (currentMode === 'quiz') return mat;
  if (currentMode === 'summary') return `${mat}\n\n---\nOPGAVE: Lav en grundig struktureret eksamensopsummering på dansk. Brug overskrifter og punktlister.`;
  return `${mat}\n\n---\nOPGAVE: Forklar følgende emne grundigt på dansk: "${topic||'de vigtigste begreber i '+currentSubject}". Brug eksempler.`;
}

async function generate() {
  const docs = allDocs[currentSubject]||[];
  if (!docs.length) { showToast('Upload mindst ét dokument først!','error'); return; }
  if (currentScope === 'single' && !selectedDocId) { showToast('Vælg en fil ved at klikke på den!','error'); return; }

  const btn = document.getElementById('genBtn');
  const loading = document.getElementById('loading');
  btn.disabled = true;
  loading.classList.add('visible');
  document.getElementById('loadingTxt').textContent = currentMode === 'quiz' ? 'GENERERER 5 NYE SPØRGSMÅL...' : currentMode === 'summary' ? 'GENERERER OPSUMMERING...' : 'GENERERER FORKLARING...';

  try {
    const body = { prompt: buildPrompt(), mode: currentMode };
    if (currentMode === 'quiz') body.existingQuestions = quizQuestions;

    const r = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await r.json();
    if (data.error) throw new Error(data.error);

    if (currentMode === 'quiz' && data.questions) {
      await saveQuizQuestions(data.questions);
      document.getElementById('quizBank').style.display = 'block';
      if (quizQuestions.length <= 5) startQuiz();
    } else {
      currentOutput = data.text;
      const labels = {summary:'// opsummering',explain:'// forklaring'};
      document.getElementById('outputLabel').textContent = labels[currentMode]||'// resultat';
      renderOutput(data.text);
      document.getElementById('outputBtns').innerHTML = `<button class="obtn" onclick="copyOutput()">📋 Kopiér</button>`;
      document.getElementById('outputWrap').classList.add('visible');
      document.getElementById('outputWrap').scrollIntoView({behavior:'smooth',block:'start'});
      await autoSave();
    }
  } catch(e) {
    document.getElementById('outputContent').innerHTML = `<div class="md-out" style="color:var(--danger)">Fejl: ${e.message}</div>`;
    document.getElementById('outputWrap').classList.add('visible');
  }
  btn.disabled = false;
  loading.classList.remove('visible');
}

// ── AUTO SAVE ──────────────────────────────────────────────
async function autoSave() {
  if (!currentOutput) return;
  try {
    const scopeFilename = currentScope === 'single' && selectedDocId
      ? (allDocs[currentSubject]||[]).find(d=>d.id===selectedDocId)?.filename||null : null;
    const existing = (allSaved[currentSubject]||[]).find(s => s.typhe===currentMode && (s.scope_filename||null)===(scopeFilename||null));
    if (existing) {
      await sb(`generated_content?id=eq.${existing.id}`,{method:'DELETE'});
      allSaved[currentSubject] = allSaved[currentSubject].filter(s=>s.id!==existing.id);
    }
    const res = await sb('generated_content',{method:'POST',body:JSON.stringify({subject:currentSubject,type:currentMode,content:currentOutput,scope_filename:scopeFilename})});
    if (!allSaved[currentSubject]) allSaved[currentSubject]=[];
    allSaved[currentSubject].unshift(res[0]);
    renderSaved();
    showToast('✓ Gemt!','success');
  } catch(e) { console.error('AutoSave fejl:',e); }
}

  const v=document.getElementById('loginInput').value.trim();
  const err=document.getElementById('loginError');
  if(v===ADMIN_PASS){
    isAdmin=true;
    sessionStorage.setItem('authRole','admin');
    document.body.classList.add('admin-active');
    document.getElementById('loginOverlay').classList.add('hidden');
    err.textContent='';
    injectAdminUI();
    setTimeout(injectGenererAltBtns,500);
  } else if(v===USER_PASS){
    isAdmin=false;
    sessionStorage.setItem('authRole','user');
    document.getElementById('loginOverlay').classList.add('hidden');
    err.textContent='';
    setTimeout(updateGenBtnVisibility, 800);
  } else {
    err.textContent='Forkert adgangskode. Prøv igen.';
    document.getElementById('loginInput').value='';
  }
}
document.addEventListener('DOMContentLoaded',function(){
  const loginInput=document.getElementById('loginInput');
  if(loginInput) loginInput.addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
  const r=sessionStorage.getItem('authRole');
  if(r==='admin'){isAdmin=true;document.body.classList.add('admin-active');document.getElementById('loginOverlay').classList.add('hidden');injectAdminUI();setTimeout(injectGenererAltBtns,500);}
  else if(r==='user'){document.getElementById('loginOverlay').classList.add('hidden');setTimeout(updateGenBtnVisibility,800);}
  const di=document.getElementById('docItems');
  if(di) _docObs.observe(di,{childList:true,subtree:true});
});

// GENERATE ALL
async function generateAll(docName){
  if(!isAdmin){showToast('Kun for admin','error');return;}
  const modes=['quiz','summary','explain'];
  showToast('Genererer alt for '+docName+'...','success');
  for(const mode of modes){
    currentMode=mode;
    document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
    await new Promise(r=>setTimeout(r,300));
    try{await generate();}catch(e){console.error('generateAll '+mode+' fejl:',e);}
    await new Promise(r=>setTimeout(r,1500));
  }
  showToast('Alt genereret for '+docName,'success');
}

// ADMIN UI
let adminUIReady=false;
function injectAdminUI(){
  if(!isAdmin) return;
  if(adminUIReady) return;
  adminUIReady=true;
  const logo=document.querySelector('header .logo');
  if(logo&&!logo.querySelector('.admin-badge')){
    const badge=document.createElement('span');
    badge.className='admin-badge';
    badge.textContent='ADMIN';
    logo.appendChild(badge);
  }
}
function injectGenererAltBtns(){
  if(!isAdmin) return;
  const cards=document.querySelectorAll('.doc-card');
  cards.forEach(function(card){
    if(card.querySelector('.generer-alt-btn')) return;
    const name=card.querySelector('.doc-name');
    const docName=name?name.textContent:'';
    const btn=document.createElement('button');
    btn.className='generer-alt-btn';
    btn.title='Generer quiz + opsummering + forklaring';
    btn.textContent='⚡';
    btn.style.cssText='background:none;border:1px solid var(--accent);color:var(--accent);cursor:pointer;padding:2px 6px;border-radius:3px;font-size:.7rem;margin-left:2px;flex-shrink:0;';
    btn.addEventListener('click',function(e){e.stopPropagation();generateAll(docName);});
    card.appendChild(btn);
  });
}
const _docObs=new MutationObserver(function(){if(isAdmin)injectGenererAltBtns();});

// UX FIX: Clear output when switching files
const _origSelectDoc = selectDoc;
selectDoc = function(id) {
  const ow = document.getElementById('outputWrap');
  if(ow) ow.classList.remove('visible');
  window.currentOutput = '';
  const qb = document.getElementById('quizBank');
  if(qb) qb.style.display = 'none';
  _origSelectDoc(id);
  setTimeout(updateGenBtnVisibility, 300);
};


// SMART GENERÉR: Show gen-btn only when no content exists for current mode+file
function updateGenBtnVisibility() {
  const btn = document.getElementById('genBtn');
  const qCtrls = document.getElementById('quizCtrls');
  const tInput = document.getElementById('topicInput');
  if (!btn) return;
  const hasContent = currentMode === 'quiz'
    ? quizQuestions.length > 0
    : (allSaved[currentSubject]||[]).some(s => {
        const scopeFn = (currentScope==='single'&&selectedDocId)
          ? (allDocs[currentSubject]||[]).find(d=>d.id===selectedDocId)?.filename||null : null;
        return s.type===currentMode && (s.scope_filename||null)===(scopeFn||null);
      });
  if (isAdmin) {
    btn.style.display = 'block';
    if (qCtrls) qCtrls.style.display = currentMode==='quiz' ? 'flex' : 'none';
    if (tInput) tInput.style.display = currentMode==='explain' ? 'block' : 'none';
  } else {
    btn.style.display = hasContent ? 'none' : 'block';
    if (qCtrls) qCtrls.style.display = (!hasContent && currentMode==='quiz') ? 'flex' : 'none';
    if (tInput) tInput.style.display = (!hasContent && currentMode==='explain') ? 'block' : 'none';
  }
}
</script>
