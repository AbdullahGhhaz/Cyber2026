<!DOCTYPE html>
<html lang="da">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EKSAMEN PREP SYSTEM</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --surface2: #1a1a28;
      --border: #2a2a40;
      --accent: #4f6ef7;
      --text: #e8e8f0;
      --muted: #6b6b8a;
      --success: #10b981;
      --danger: #ef4444;
      --warn: #f59e0b;
      --font-mono: 'Space Mono', monospace;
      --font-body: 'DM Sans', sans-serif;
    }

    [data-theme="light"] {
      --bg: #f4f4f8;
      --surface: #fff;
      --surface2: #eaeaf2;
      --border: #d0d0e0;
      --text: #111120;
      --muted: #7070a0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      transition: background .3s, color .3s;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 28px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-family: var(--font-mono);
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: .15em;
      color: var(--accent);
    }

    .logo span {
      color: var(--text);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .theme-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: .75rem;
      transition: all .2s;
    }

    .theme-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--success);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: .4
      }
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 20px;
    }

    .section-label {
      font-family: var(--font-mono);
      font-size: .7rem;
      letter-spacing: .2em;
      color: var(--muted);
      margin-bottom: 14px;
      text-transform: uppercase;
    }

    .subjects-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 28px;
    }

    .subject-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: .75rem;
      letter-spacing: .08em;
      transition: all .2s;
      text-transform: uppercase;
    }

    .subject-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .subject-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 0 16px rgba(79, 110, 247, .35);
    }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 28px 0;
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    @media(max-width:700px) {
      .two-col {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }

    .panel-title {
      font-family: var(--font-mono);
      font-size: .75rem;
      letter-spacing: .15em;
      color: var(--accent);
      margin-bottom: 16px;
      text-transform: uppercase;
    }

    .upload-box {
      border: 2px dashed var(--border);
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      background: var(--surface2);
      transition: all .2s;
      cursor: pointer;
      position: relative;
      margin-bottom: 14px;
    }

    .upload-box:hover,
    .upload-box.dragover {
      border-color: var(--accent);
      box-shadow: 0 0 16px rgba(79, 110, 247, .15);
    }

    .upload-box input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .upload-icon {
      font-size: 1.5rem;
      margin-bottom: 6px;
    }

    .upload-text {
      font-size: .85rem;
      color: var(--muted);
    }

    .upload-text strong {
      color: var(--accent);
    }

    .doc-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 300px;
      overflow-y: auto;
    }

    .doc-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: .82rem;
    }

    .doc-item.new {
      border-color: var(--accent);
    }

    .doc-name {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }

    .doc-name-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .doc-chars {
      color: var(--muted);
      font-size: .72rem;
      font-family: var(--font-mono);
      white-space: nowrap;
    }

    .doc-del {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      transition: all .15s;
      font-size: .9rem;
    }

    .doc-del:hover {
      color: var(--danger);
      background: rgba(239, 68, 68, .1);
    }

    .empty-state {
      text-align: center;
      padding: 20px;
      color: var(--muted);
      font-size: .85rem;
    }

    .mode-tabs {
      display: flex;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .mode-tab {
      flex: 1;
      background: var(--surface);
      border: none;
      color: var(--muted);
      padding: 10px;
      cursor: pointer;
      font-family: var(--font-body);
      font-size: .85rem;
      font-weight: 500;
      transition: all .2s;
      border-right: 1px solid var(--border);
    }

    .mode-tab:last-child {
      border-right: none;
    }

    .mode-tab:hover {
      color: var(--text);
      background: var(--surface2);
    }

    .mode-tab.active {
      background: var(--accent);
      color: #fff;
    }

    .quiz-opts-row {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
      align-items: center;
    }

    .quiz-opts-row label {
      font-size: .82rem;
      color: var(--muted);
    }

    .quiz-opts-row select,
    .quiz-opts-row input[type="number"] {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 7px;
      font-family: var(--font-body);
      font-size: .82rem;
    }

    .quiz-opts-row input[type="number"] {
      width: 65px;
    }

    #explainInput {
      margin-bottom: 14px;
      display: none;
    }

    #explainTopic {
      width: 100%;
      padding: 10px 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      font-family: var(--font-body);
      font-size: .88rem;
    }

    #explainTopic:focus {
      outline: none;
      border-color: var(--accent);
    }

    .generate-btn {
      width: 100%;
      background: var(--accent);
      border: none;
      color: #fff;
      padding: 13px;
      border-radius: 10px;
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: .85rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      font-weight: 700;
      transition: all .2s;
      box-shadow: 0 4px 20px rgba(79, 110, 247, .3);
    }

    .generate-btn:hover {
      background: #3a5be8;
      transform: translateY(-1px);
    }

    .generate-btn:disabled {
      opacity: .5;
      cursor: not-allowed;
      transform: none;
    }

    .stats-bar {
      font-family: var(--font-mono);
      font-size: .72rem;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .stats-bar span {
      color: var(--success);
    }

    .output-area {
      margin-top: 24px;
    }

    .output-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .output-title {
      font-family: var(--font-mono);
      font-size: .8rem;
      letter-spacing: .15em;
      color: var(--accent);
      text-transform: uppercase;
    }

    .output-actions {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: .78rem;
      transition: all .2s;
    }

    .action-btn:hover {
      color: var(--text);
      border-color: var(--accent);
    }

    .quiz-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .quiz-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      animation: fadeIn .3s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .quiz-q-number {
      font-family: var(--font-mono);
      font-size: .7rem;
      color: var(--accent);
      margin-bottom: 5px;
      letter-spacing: .1em;
    }

    .quiz-q {
      font-weight: 600;
      font-size: .92rem;
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .quiz-options-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .quiz-opt {
      padding: 9px 13px;
      border-radius: 8px;
      border: 1px solid var(--border);
      cursor: pointer;
      font-size: .85rem;
      transition: all .15s;
      background: var(--surface2);
    }

    .quiz-opt:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .quiz-opt.correct {
      border-color: var(--success);
      background: rgba(16, 185, 129, .1);
      color: var(--success);
    }

    .quiz-opt.wrong {
      border-color: var(--danger);
      background: rgba(239, 68, 68, .1);
      color: var(--danger);
    }

    .quiz-reveal {
      margin-top: 10px;
      padding: 9px 13px;
      background: var(--surface2);
      border-radius: 8px;
      font-size: .82rem;
      color: var(--muted);
      display: none;
    }

    .quiz-reveal.visible {
      display: block;
    }

    .text-output {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 22px;
      font-size: .9rem;
      line-height: 1.75;
      white-space: pre-wrap;
    }

    .loading {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 32px;
      background: var(--surface);
      border-radius: 12px;
      border: 1px solid var(--border);
      text-align: center;
      margin-top: 16px;
    }

    .loading.visible {
      display: flex;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .loading-text {
      font-family: var(--font-mono);
      font-size: .78rem;
      color: var(--muted);
      letter-spacing: .1em;
    }

    .saved-content {
      margin-top: 16px;
    }

    .saved-item {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all .2s;
    }

    .saved-item:hover {
      border-color: var(--accent);
    }

    .saved-item-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .saved-item-title {
      font-family: var(--font-mono);
      font-size: .72rem;
      color: var(--accent);
      text-transform: uppercase;
    }

    .saved-item-date {
      font-size: .72rem;
      color: var(--muted);
    }

    .saved-item-del {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: .85rem;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .saved-item-del:hover {
      color: var(--danger);
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--success);
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: .85rem;
      font-family: var(--font-mono);
      opacity: 0;
      transition: opacity .3s;
      z-index: 999;
    }

    .toast.visible {
      opacity: 1;
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">EXAM<span>.</span>PREP</div>
    <div class="header-right">
      <div class="status-dot"></div>
      <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">☀ LYS</button>
    </div>
  </header>

  <div class="container">
    <div class="section-label">// vælg fag</div>
    <div class="subjects-grid">
      <button class="subject-btn active" onclick="selectSubject(this,'Programmering')">Programmering</button>
      <button class="subject-btn" onclick="selectSubject(this,'Forretningsforståelse')">Forretningsforståelse</button>
      <button class="subject-btn" onclick="selectSubject(this,'Computerarkitektur')">Computerarkitektur</button>
    </div>

    <hr class="divider">

    <div class="two-col">
      <!-- VENSTRE: Upload + dokumenter -->
      <div>
        <div class="panel">
          <div class="panel-title">// dokumenter for <span id="subjectLabel">Programmering</span></div>
          <div class="upload-box" id="uploadBox" ondragover="event.preventDefault();this.classList.add('dragover')"
            ondragleave="this.classList.remove('dragover')" ondrop="handleDrop(event)">
            <input type="file" id="fileInput" multiple accept=".pdf,.pptx,.ppt,.docx,.doc,.txt,.md"
              onchange="handleFiles(this.files)">
            <div class="upload-icon">📂</div>
            <div class="upload-text">Træk filer hertil eller <strong>klik</strong></div>
          </div>
          <div class="doc-list" id="docList">
            <div class="empty-state">Ingen dokumenter gemt endnu</div>
          </div>
        </div>

        <!-- Gemte resultater -->
        <div class="panel" style="margin-top:16px;">
          <div class="panel-title">// gemte resultater</div>
          <div id="savedList">
            <div class="empty-state">Ingen gemte resultater endnu</div>
          </div>
        </div>
      </div>

      <!-- HØJRE: Generér -->
      <div class="panel">
        <div class="panel-title">// generér indhold</div>

        <div class="stats-bar" id="statsBar">Ingen dokumenter indlæst</div>

        <div class="mode-tabs">
          <button class="mode-tab active" onclick="selectMode(this,'quiz')">🎯 Quiz</button>
          <button class="mode-tab" onclick="selectMode(this,'summary')">📋 Opsummering</button>
          <button class="mode-tab" onclick="selectMode(this,'explain')">💡 Forklaring</button>
        </div>

        <div id="quizOptsRow" class="quiz-opts-row">
          <label>Antal:</label>
          <input type="number" id="numQuestions" value="5" min="1" max="20">
          <label>Type:</label>
          <select id="quizType">
            <option value="multiple">Multiplechoice</option>
            <option value="open">Åbne spørgsmål</option>
            <option value="truefalse">Sandt/Falsk</option>
          </select>
        </div>

        <div id="explainInput">
          <input type="text" id="explainTopic" placeholder="Hvad vil du have forklaret? (fx 'OSI-modellen')">
        </div>

        <button class="generate-btn" id="generateBtn" onclick="generate()">⚡ GENERÉR</button>

        <div class="loading" id="loading">
          <div class="spinner"></div>
          <div class="loading-text" id="loadingText">GENERERER...</div>
        </div>

        <div class="output-area" id="outputArea" style="display:none;">
          <div class="output-header">
            <div class="output-title" id="outputTitle">// resultat</div>
            <div class="output-actions">
              <button class="action-btn" onclick="saveResult()">💾 Gem</button>
              <button class="action-btn" onclick="copyOutput()">Kopiér</button>
            </div>
          </div>
          <div id="outputContent"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // Supabase config — erstat med dine egne
    const SUPABASE_URL = 'https://ojpmrfhtepdvdinoixvs.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_rGJ698kCVrcnW3BsFl8Mpg_hDL20fow';

    let currentTheme = 'dark';
    let currentSubject = 'Programmering';
    let currentMode = 'quiz';
    let currentOutput = '';
    let subjectDocs = {}; // { subject: [{id, filename, content, chars}] }
    let subjectSaved = {}; // { subject: [{id, type, content, created_at}] }

    // ── INIT ──────────────────────────────────────────────────
    window.addEventListener('load', () => {
      loadSubjectData();
    });

    // ── THEME ──────────────────────────────────────────────────
    function toggleTheme() {
      currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', currentTheme === 'light' ? 'light' : '');
      document.getElementById('themeBtn').textContent = currentTheme === 'dark' ? '☀ LYS' : '🌙 MØRK';
    }

    // ── SUBJECT ────────────────────────────────────────────────
    function selectSubject(btn, name) {
      document.querySelectorAll('.subject-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentSubject = name;
      document.getElementById('subjectLabel').textContent = name;
      document.getElementById('outputArea').style.display = 'none';
      loadSubjectData();
    }

    // ── MODE ───────────────────────────────────────────────────
    function selectMode(btn, mode) {
      document.querySelectorAll('.mode-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentMode = mode;
      document.getElementById('quizOptsRow').style.display = mode === 'quiz' ? 'flex' : 'none';
      document.getElementById('explainInput').style.display = mode === 'explain' ? 'block' : 'none';
      document.getElementById('outputArea').style.display = 'none';
    }

    // ── SUPABASE HELPERS ───────────────────────────────────────
    async function sbFetch(path, options = {}) {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
        ...options,
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`,
          'Content-Type': 'application/json',
          'Prefer': 'return=representation',
          ...options.headers
        }
      });
      if (!res.ok) {
        const err = await res.text();
        throw new Error(err);
      }
      const text = await res.text();
      return text ? JSON.parse(text) : [];
    }

    // ── LOAD DATA ──────────────────────────────────────────────
    async function loadSubjectData() {
      try {
        // Load documents
        const docs = await sbFetch(`documents?subject=eq.${encodeURIComponent(currentSubject)}&order=created_at.asc`);
        subjectDocs[currentSubject] = docs;

        // Load saved content
        const saved = await sbFetch(`generated_content?subject=eq.${encodeURIComponent(currentSubject)}&order=created_at.desc`);
        subjectSaved[currentSubject] = saved;

        renderDocList();
        renderSavedList();
        updateStats();
      } catch (err) {
        console.error('Load error:', err);
      }
    }

    // ── FILE HANDLING ──────────────────────────────────────────
    function handleDrop(e) {
      e.preventDefault();
      document.getElementById('uploadBox').classList.remove('dragover');
      handleFiles(e.dataTransfer.files);
    }

    async function handleFiles(files) {
      for (const file of files) {
        const ext = file.name.split('.').pop().toLowerCase();
        let text = '';
        try {
          if (ext === 'pdf') text = await readPDF(file);
          else if (['docx', 'doc'].includes(ext)) text = await readDOCX(file);
          else if (['pptx', 'ppt'].includes(ext)) text = await readPPTX(file);
          else if (['txt', 'md'].includes(ext)) text = await readText(file);
          else { showToast('Ukendt filtype: ' + file.name); continue; }

          if (!text || text.length < 10) { showToast('Ingen tekst fundet i: ' + file.name); continue; }

          // Gem i Supabase
          const result = await sbFetch('documents', {
            method: 'POST',
            body: JSON.stringify({
              subject: currentSubject,
              filename: file.name,
              content: text.slice(0, 100000)
            })
          });

          if (!subjectDocs[currentSubject]) subjectDocs[currentSubject] = [];
          subjectDocs[currentSubject].push(result[0]);
          renderDocList();
          updateStats();
          showToast('✓ ' + file.name + ' gemt!');
        } catch (err) {
          showToast('Fejl: ' + err.message);
        }
      }
    }

    // ── FILE READERS ───────────────────────────────────────────
    async function readPDF(file) {
      const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
      let text = '';
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        text += content.items.map(item => item.str).join(' ') + '\n';
      }
      return text.trim();
    }

    async function readDOCX(file) {
      const result = await mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
      return result.value.trim();
    }

    async function readPPTX(file) {
      const zip = await JSZip.loadAsync(await file.arrayBuffer());
      const slideFiles = Object.keys(zip.files)
        .filter(n => n.match(/^ppt\/slides\/slide\d+\.xml$/))
        .sort((a, b) => parseInt(a.match(/\d+/)?.[0] || 0) - parseInt(b.match(/\d+/)?.[0] || 0));
      let text = '';
      for (const sf of slideFiles) {
        const xml = await zip.files[sf].async('text');
        const slideText = (xml.match(/<a:t[^>]*>([^<]+)<\/a:t>/g) || []).map(m => m.replace(/<[^>]+>/g, '')).join(' ').trim();
        if (slideText) text += slideText + '\n';
      }
      return text.trim();
    }

    async function readText(file) {
      return new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = e => res(e.target.result);
        r.onerror = rej;
        r.readAsText(file);
      });
    }

    // ── DELETE DOCUMENT ────────────────────────────────────────
    async function deleteDoc(id) {
      try {
        await sbFetch(`documents?id=eq.${id}`, { method: 'DELETE' });
        subjectDocs[currentSubject] = subjectDocs[currentSubject].filter(d => d.id !== id);
        renderDocList();
        updateStats();
        showToast('Dokument slettet');
      } catch (err) {
        showToast('Fejl: ' + err.message);
      }
    }

    // ── DELETE SAVED ───────────────────────────────────────────
    async function deleteSaved(id) {
      try {
        await sbFetch(`generated_content?id=eq.${id}`, { method: 'DELETE' });
        subjectSaved[currentSubject] = subjectSaved[currentSubject].filter(s => s.id !== id);
        renderSavedList();
        showToast('Slettet');
      } catch (err) {
        showToast('Fejl: ' + err.message);
      }
    }

    // ── RENDER DOC LIST ────────────────────────────────────────
    function renderDocList() {
      const docs = subjectDocs[currentSubject] || [];
      const list = document.getElementById('docList');
      if (!docs.length) {
        list.innerHTML = '<div class="empty-state">Ingen dokumenter gemt endnu</div>';
        return;
      }
      const icons = { pdf: '📄', pptx: '📊', ppt: '📊', docx: '📝', doc: '📝', txt: '📃', md: '📃' };
      list.innerHTML = docs.map(d => {
        const ext = d.filename.split('.').pop().toLowerCase();
        const icon = icons[ext] || '📁';
        const chars = d.content?.length || 0;
        const date = new Date(d.created_at).toLocaleDateString('da-DK');
        return `<div class="doc-item">
      <div class="doc-name">
        <span>${icon}</span>
        <span class="doc-name-text" title="${d.filename}">${d.filename}</span>
        <span class="doc-chars">${chars.toLocaleString()}t · ${date}</span>
      </div>
      <button class="doc-del" onclick="deleteDoc('${d.id}')" title="Slet">✕</button>
    </div>`;
      }).join('');
    }

    // ── RENDER SAVED LIST ──────────────────────────────────────
    function renderSavedList() {
      const saved = subjectSaved[currentSubject] || [];
      const list = document.getElementById('savedList');
      if (!saved.length) {
        list.innerHTML = '<div class="empty-state">Ingen gemte resultater endnu</div>';
        return;
      }
      const typeIcons = { quiz: '🎯', summary: '📋', explain: '💡' };
      const typeLabels = { quiz: 'Quiz', summary: 'Opsummering', explain: 'Forklaring' };
      list.innerHTML = saved.map(s => {
        const date = new Date(s.created_at).toLocaleDateString('da-DK');
        const icon = typeIcons[s.type] || '📄';
        const label = typeLabels[s.type] || s.type;
        return `<div class="saved-item" onclick="showSaved('${s.id}')">
      <div class="saved-item-header">
        <div class="saved-item-title">${icon} ${label}</div>
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="saved-item-date">${date}</span>
          <button class="saved-item-del" onclick="event.stopPropagation();deleteSaved('${s.id}')">✕</button>
        </div>
      </div>
    </div>`;
      }).join('');
    }

    // ── SHOW SAVED ─────────────────────────────────────────────
    function showSaved(id) {
      const saved = (subjectSaved[currentSubject] || []).find(s => s.id === id);
      if (!saved) return;
      currentOutput = saved.content;
      currentMode = saved.type;
      document.getElementById('outputArea').style.display = 'block';
      const typeLabels = { quiz: '// quiz spørgsmål', summary: '// opsummering', explain: '// forklaring' };
      document.getElementById('outputTitle').textContent = typeLabels[saved.type] || '// resultat';
      renderOutput(saved.content);
    }

    // ── UPDATE STATS ───────────────────────────────────────────
    function updateStats() {
      const docs = subjectDocs[currentSubject] || [];
      const bar = document.getElementById('statsBar');
      if (!docs.length) { bar.innerHTML = 'Ingen dokumenter indlæst'; return; }
      const total = docs.reduce((s, d) => s + (d.content?.length || 0), 0);
      bar.innerHTML = `<span>${docs.length} dokument(er)</span> · ${total.toLocaleString()} tegn gemt`;
    }

    // ── BUILD PROMPT ───────────────────────────────────────────
    function buildPrompt() {
      const docs = subjectDocs[currentSubject] || [];
      const MAX = 60000;
      let used = 0, textParts = '';
      for (const d of docs) {
        if (used >= MAX) break;
        const chunk = (d.content || '').slice(0, MAX - used);
        if (chunk.trim()) { textParts += `\n\n--- ${d.filename} ---\n${chunk}`; used += chunk.length; }
      }

      const materiale = textParts
        ? `Her er alt undervisningsmateriale for faget "${currentSubject}":\n${textParts}`
        : `Brug din generelle viden om "${currentSubject}".`;

      const n = document.getElementById('numQuestions')?.value || 5;
      const qType = document.getElementById('quizType')?.value || 'multiple';
      const topic = document.getElementById('explainTopic')?.value || '';

      if (currentMode === 'quiz') {
        if (qType === 'multiple') {
          return `${materiale}\n\n---\nOPGAVE: Lav præcis ${n} multiplechoice spørgsmål på dansk baseret på materialet. Start direkte med Q1 - ingen indledning:\n\nQ1: [spørgsmål]\nA) [svar]\nB) [svar]\nC) [svar]\nD) [svar]\nSvar: A — [forklaring]\n\nQ2: osv. Fortsæt til Q${n}.`;
        } else if (qType === 'open') {
          return `${materiale}\n\n---\nOPGAVE: Lav præcis ${n} åbne eksamensspørgsmål på dansk. Start direkte med Q1:\n\nQ1: [spørgsmål]\nSvar: [svar]\n\nFortsæt til Q${n}.`;
        } else {
          return `${materiale}\n\n---\nOPGAVE: Lav præcis ${n} sandt/falsk påstande på dansk. Start direkte med Q1:\n\nQ1: [påstand]\nSvar: Sandt — [forklaring]\n\nFortsæt til Q${n}.`;
        }
      } else if (currentMode === 'summary') {
        return `${materiale}\n\n---\nOPGAVE: Lav en struktureret eksamensopsummering på dansk af alt materialet. Organiser med emner og nøglepunkter. Kun opsummering - ingen spørgsmål.`;
      } else {
        const t = topic || `de vigtigste begreber i ${currentSubject}`;
        return `${materiale}\n\n---\nOPGAVE: Forklar følgende emne grundigt og pædagogisk på dansk: "${t}". Brug eksempler. Kun forklaring - ingen spørgsmål.`;
      }
    }

    // ── GENERATE ───────────────────────────────────────────────
    async function generate() {
      const docs = subjectDocs[currentSubject] || [];
      if (!docs.length) { showToast('Upload mindst ét dokument først!'); return; }

      const btn = document.getElementById('generateBtn');
      const loading = document.getElementById('loading');
      btn.disabled = true;
      loading.classList.add('visible');
      document.getElementById('outputArea').style.display = 'none';
      document.getElementById('loadingText').textContent = 'GENERERER...';

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: buildPrompt() })
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        currentOutput = data.text;
        const typeLabels = { quiz: '// quiz spørgsmål', summary: '// opsummering', explain: '// forklaring' };
        document.getElementById('outputTitle').textContent = typeLabels[currentMode] || '// resultat';
        renderOutput(data.text);
        document.getElementById('outputArea').style.display = 'block';
        document.getElementById('outputArea').scrollIntoView({ behavior: 'smooth', block: 'start' });
      } catch (err) {
        document.getElementById('outputContent').innerHTML = `<div class="text-output" style="color:var(--danger)">Fejl: ${err.message}</div>`;
        document.getElementById('outputArea').style.display = 'block';
      }

      btn.disabled = false;
      loading.classList.remove('visible');
    }

    // ── SAVE RESULT ────────────────────────────────────────────
    async function saveResult() {
      if (!currentOutput) return;
      try {
        const result = await sbFetch('generated_content', {
          method: 'POST',
          body: JSON.stringify({
            subject: currentSubject,
            type: currentMode,
            content: currentOutput
          })
        });
        if (!subjectSaved[currentSubject]) subjectSaved[currentSubject] = [];
        subjectSaved[currentSubject].unshift(result[0]);
        renderSavedList();
        showToast('✓ Gemt!');
      } catch (err) {
        showToast('Fejl ved gemning: ' + err.message);
      }
    }

    // ── RENDER OUTPUT ──────────────────────────────────────────
    function renderOutput(text) {
      const content = document.getElementById('outputContent');
      if (currentMode === 'quiz') {
        content.innerHTML = renderQuiz(text);
      } else {
        content.innerHTML = `<div class="text-output">${esc(text)}</div>`;
      }
    }

    function renderQuiz(text) {
      const blocks = text.split(/\n(?=Q\d+:)/);
      if (blocks.length <= 1) return `<div class="text-output">${esc(text)}</div>`;
      return '<div class="quiz-container">' + blocks.filter(b => b.trim()).map((block, i) => {
        const lines = block.trim().split('\n');
        const question = lines[0].replace(/^Q\d+:\s*/, '');
        const options = lines.filter(l => /^[A-D]\)/.test(l.trim()));
        const answerLine = lines.find(l => /^Svar:/.test(l.trim())) || '';
        let html = `<div class="quiz-card"><div class="quiz-q-number">SPØRGSMÅL ${i + 1}</div><div class="quiz-q">${esc(question)}</div>`;
        if (options.length > 0) {
          html += '<div class="quiz-options-list">' +
            options.map(opt => `<div class="quiz-opt" onclick="handleAnswer(this,'${opt[0]}',\`${escAttr(answerLine)}\`)">${esc(opt)}</div>`).join('') +
            '</div>';
          html += `<div class="quiz-reveal">${esc(answerLine)}</div>`;
        } else {
          html += `<div class="quiz-reveal visible">${esc(lines.slice(1).join('\n'))}</div>`;
        }
        return html + '</div>';
      }).join('') + '</div>';
    }

    function handleAnswer(el, letter, answerLine) {
      const card = el.closest('.quiz-card');
      if (card.querySelector('.correct,.wrong')) return;
      const m = answerLine.match(/Svar:\s*([A-D])/);
      const correct = m ? m[1] : null;
      card.querySelectorAll('.quiz-opt').forEach(o => {
        const l = o.textContent.trim()[0];
        if (l === letter) o.classList.add(letter === correct ? 'correct' : 'wrong');
        if (correct && l === correct) o.classList.add('correct');
      });
      card.querySelector('.quiz-reveal')?.classList.add('visible');
    }

    function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
    function escAttr(t) { return String(t).replace(/`/g, '\\`').replace(/\$/g, '\\$'); }

    function copyOutput() {
      navigator.clipboard.writeText(document.getElementById('outputContent').innerText).then(() => {
        showToast('✓ Kopieret!');
      });
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('visible');
      setTimeout(() => t.classList.remove('visible'), 2500);
    }
  </script>
</body>
