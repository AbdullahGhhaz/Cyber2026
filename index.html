<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EKSAMEN PREP</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root {
  --bg:#080b14;--bg2:#0d1220;--surface:#111827;--surface2:#1a2235;
  --border:#1e2d47;--border2:#253652;--accent:#3b82f6;--accent2:#60a5fa;
  --glow:rgba(59,130,246,0.15);--text:#e2e8f0;--text2:#94a3b8;--muted:#4b6080;
  --success:#10b981;--danger:#ef4444;--warn:#f59e0b;
  --mono:'JetBrains Mono',monospace;--sans:'Outfit',sans-serif;
}
[data-theme="light"]{
  --bg:#f0f4ff;--bg2:#e8edf8;--surface:#fff;--surface2:#f1f5fb;
  --border:#dce3f0;--border2:#c8d3e8;--accent:#2563eb;--accent2:#3b82f6;
  --glow:rgba(37,99,235,0.1);--text:#0f172a;--text2:#475569;--muted:#94a3b8;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;transition:background .3s,color .3s;}

/* HEADER */
header{display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:56px;border-bottom:1px solid var(--border);background:rgba(8,11,20,0.9);backdrop-filter:blur(12px);position:sticky;top:0;z-index:100;}
[data-theme="light"] header{background:rgba(240,244,255,0.9);}
.logo{font-family:var(--mono);font-size:.9rem;font-weight:700;color:var(--accent2);display:flex;align-items:center;gap:8px;}
.logo-dot{width:7px;height:7px;background:var(--success);border-radius:50%;box-shadow:0 0 8px var(--success);animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.hbtn{background:var(--surface2);border:1px solid var(--border);color:var(--text2);padding:5px 12px;border-radius:7px;cursor:pointer;font-family:var(--mono);font-size:.7rem;transition:all .2s;}
.hbtn:hover{border-color:var(--accent);color:var(--accent2);}

/* APP LAYOUT */
.app{display:grid;grid-template-columns:280px 1fr;height:calc(100vh - 56px);}

/* SIDEBAR */
.sidebar{border-right:1px solid var(--border);background:var(--bg2);display:flex;flex-direction:column;overflow:hidden;}
.sidebar-section{padding:14px 14px 10px;border-bottom:1px solid var(--border);}
.slabel{font-family:var(--mono);font-size:.62rem;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin-bottom:8px;}
.sub-list{display:flex;flex-direction:column;gap:3px;}
.sub-btn{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;cursor:pointer;border:1px solid transparent;background:transparent;color:var(--text2);font-family:var(--sans);font-size:.85rem;font-weight:500;transition:all .2s;width:100%;text-align:left;}
.sub-btn:hover{background:var(--surface);color:var(--text);border-color:var(--border);}
.sub-btn.active{background:var(--glow);color:var(--accent2);border-color:var(--accent);}
.sub-icon{font-size:.95rem;}
.sub-count{margin-left:auto;font-family:var(--mono);font-size:.65rem;color:var(--muted);background:var(--surface2);padding:1px 6px;border-radius:8px;}
.sub-btn.active .sub-count{background:rgba(59,130,246,.2);color:var(--accent2);}

/* UPLOAD */
.sidebar-docs{flex:1;overflow-y:auto;padding:12px 14px;}
.sidebar-docs::-webkit-scrollbar{width:3px;}
.sidebar-docs::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
.upload-zone{border:1.5px dashed var(--border2);border-radius:9px;padding:14px;text-align:center;cursor:pointer;position:relative;transition:all .2s;margin-bottom:10px;}
.upload-zone:hover,.upload-zone.dragover{border-color:var(--accent);background:var(--glow);}
.upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.uz-icon{font-size:1.2rem;margin-bottom:3px;}
.uz-text{font-size:.75rem;color:var(--text2);}
.uz-text strong{color:var(--accent2);}

/* DOC CARDS */
.doc-items{display:flex;flex-direction:column;gap:5px;}
.doc-card{display:flex;align-items:center;gap:7px;padding:7px 9px;background:var(--surface);border:1px solid var(--border);border-radius:7px;transition:all .2s;cursor:pointer;}
.doc-card:hover{border-color:var(--border2);}
.doc-card.selected{border-color:var(--accent);background:var(--glow);}
.doc-icon{font-size:.9rem;flex-shrink:0;}
.doc-info{flex:1;min-width:0;}
.doc-name{font-size:.75rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);}
.doc-meta{font-family:var(--mono);font-size:.6rem;color:var(--muted);margin-top:1px;}
.doc-del{background:none;border:none;color:var(--muted);cursor:pointer;padding:2px 4px;border-radius:3px;font-size:.75rem;transition:all .15s;flex-shrink:0;}
.doc-del:hover{color:var(--danger);background:rgba(239,68,68,.1);}
.empty-docs{text-align:center;padding:20px 10px;color:var(--muted);font-size:.78rem;}

/* SAVED */
.sidebar-saved{padding:10px 14px 14px;border-top:1px solid var(--border);}
.saved-list{display:flex;flex-direction:column;gap:4px;max-height:160px;overflow-y:auto;}
.saved-card{display:flex;align-items:center;gap:7px;padding:6px 9px;background:var(--surface);border:1px solid var(--border);border-radius:7px;cursor:pointer;transition:all .2s;}
.saved-card:hover{border-color:var(--accent);background:var(--glow);}
.saved-card-icon{font-size:.85rem;}
.saved-card-info{flex:1;min-width:0;}
.saved-card-type{font-size:.73rem;font-weight:600;color:var(--text2);}
.saved-card-sub{font-family:var(--mono);font-size:.6rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.saved-del{background:none;border:none;color:var(--muted);cursor:pointer;padding:2px 4px;border-radius:3px;font-size:.72rem;}
.saved-del:hover{color:var(--danger);}

/* MAIN */
.main{display:flex;flex-direction:column;overflow:hidden;}
.main-topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;border-bottom:1px solid var(--border);background:var(--bg2);gap:12px;flex-wrap:wrap;}
.scope-tabs{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;padding:3px;gap:3px;}
.scope-btn{padding:5px 14px;border:none;background:transparent;color:var(--text2);font-family:var(--sans);font-size:.8rem;font-weight:500;border-radius:5px;cursor:pointer;transition:all .2s;white-space:nowrap;}
.scope-btn:hover{color:var(--text);background:var(--surface2);}
.scope-btn.active{background:var(--accent);color:#fff;box-shadow:0 2px 10px rgba(59,130,246,.35);}
.stats-pill{font-family:var(--mono);font-size:.68rem;color:var(--text2);background:var(--surface);border:1px solid var(--border);padding:4px 10px;border-radius:20px;}
.stats-pill span{color:var(--success);}
.mode-tabs{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;padding:3px;gap:3px;}
.mode-btn{flex:1;padding:6px 12px;border:none;background:transparent;color:var(--text2);font-family:var(--sans);font-size:.8rem;font-weight:500;border-radius:5px;cursor:pointer;transition:all .2s;white-space:nowrap;}
.mode-btn:hover{color:var(--text);background:var(--surface2);}
.mode-btn.active{background:var(--accent);color:#fff;box-shadow:0 2px 10px rgba(59,130,246,.35);}

/* CONTENT AREA */
.main-body{flex:1;overflow-y:auto;padding:20px 24px;}
.main-body::-webkit-scrollbar{width:5px;}
.main-body::-webkit-scrollbar-thumb{background:var(--border2);border-radius:5px;}

/* CONTROLS */
.controls-row{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
.ctrl-group{display:flex;align-items:center;gap:7px;}
.ctrl-label{font-size:.78rem;color:var(--text2);}
.ctrl-select,.ctrl-num{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:7px;font-family:var(--sans);font-size:.8rem;}
.ctrl-select:focus,.ctrl-num:focus{outline:none;border-color:var(--accent);}
.ctrl-num{width:60px;}
.topic-input{flex:1;min-width:180px;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:7px 12px;border-radius:7px;font-family:var(--sans);font-size:.82rem;}
.topic-input:focus{outline:none;border-color:var(--accent);}
.scope-info{font-family:var(--mono);font-size:.7rem;color:var(--accent2);background:var(--glow);border:1px solid var(--accent);padding:5px 12px;border-radius:6px;}
.gen-btn{background:var(--accent);border:none;color:#fff;padding:8px 24px;border-radius:8px;cursor:pointer;font-family:var(--mono);font-size:.75rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;transition:all .2s;box-shadow:0 3px 16px rgba(59,130,246,.3);margin-left:auto;}
.gen-btn:hover{background:#2563eb;transform:translateY(-1px);box-shadow:0 4px 20px rgba(59,130,246,.45);}
.gen-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none;}

/* LOADING */
.loading-bar{display:none;align-items:center;gap:12px;padding:16px 20px;background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:16px;}
.loading-bar.visible{display:flex;}
.spinner{width:18px;height:18px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-txt{font-family:var(--mono);font-size:.72rem;color:var(--text2);}

/* OUTPUT */
.output-wrap{display:none;}
.output-wrap.visible{display:block;}
.output-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.output-label{font-family:var(--mono);font-size:.7rem;letter-spacing:.15em;color:var(--accent2);text-transform:uppercase;}
.output-btns{display:flex;gap:7px;}
.obtn{background:var(--surface2);border:1px solid var(--border);color:var(--text2);padding:5px 12px;border-radius:6px;cursor:pointer;font-size:.76rem;transition:all .2s;}
.obtn:hover{border-color:var(--accent);color:var(--accent2);}
.obtn.save{border-color:var(--success);color:var(--success);}
.obtn.save:hover{background:rgba(16,185,129,.1);}

/* QUIZ */
.quiz-grid{display:flex;flex-direction:column;gap:14px;}
.quiz-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;animation:up .3s ease;}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.quiz-num{font-family:var(--mono);font-size:.62rem;color:var(--accent2);margin-bottom:6px;letter-spacing:.12em;text-transform:uppercase;}
.quiz-q{font-weight:600;font-size:.93rem;line-height:1.55;margin-bottom:12px;}
.quiz-opts{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
@media(max-width:860px){.quiz-opts{grid-template-columns:1fr;}}
.quiz-opt{padding:9px 13px;border-radius:8px;border:1px solid var(--border);cursor:pointer;font-size:.83rem;background:var(--surface2);color:var(--text);text-align:left;transition:all .15s;line-height:1.4;}
.quiz-opt:hover:not(:disabled){border-color:var(--accent);color:var(--accent2);background:var(--glow);}
.quiz-opt.correct{border-color:var(--success);background:rgba(16,185,129,.12);color:var(--success);}
.quiz-opt.wrong{border-color:var(--danger);background:rgba(239,68,68,.1);color:var(--danger);}
.quiz-opt:disabled{cursor:default;}
.quiz-reveal{margin-top:10px;padding:10px 14px;background:var(--bg2);border-left:3px solid var(--accent);border-radius:0 7px 7px 0;font-size:.8rem;color:var(--text2);display:none;line-height:1.55;}
.quiz-reveal.visible{display:block;}

/* MARKDOWN */
.md-out{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:26px 30px;font-size:.9rem;line-height:1.8;color:var(--text);}
.md-out h1{font-size:1.3rem;font-weight:700;margin-bottom:14px;color:var(--accent2);border-bottom:1px solid var(--border);padding-bottom:8px;}
.md-out h2{font-size:1.05rem;font-weight:600;margin:20px 0 8px;color:var(--text);}
.md-out h3{font-size:.93rem;font-weight:600;margin:14px 0 6px;color:var(--text2);}
.md-out p{margin-bottom:10px;}
.md-out ul,.md-out ol{padding-left:18px;margin-bottom:10px;}
.md-out li{margin-bottom:4px;}
.md-out strong{color:var(--accent2);font-weight:600;}
.md-out em{color:var(--text2);font-style:italic;}
.md-out code{background:var(--surface2);border:1px solid var(--border);padding:1px 6px;border-radius:4px;font-family:var(--mono);font-size:.8rem;color:var(--warn);}
.md-out pre{background:var(--bg2);border:1px solid var(--border);padding:14px;border-radius:8px;overflow-x:auto;margin-bottom:12px;}
.md-out pre code{background:none;border:none;padding:0;color:var(--text2);}
.md-out blockquote{border-left:3px solid var(--accent);padding:8px 14px;background:var(--glow);border-radius:0 7px 7px 0;margin-bottom:10px;color:var(--text2);}
.md-out hr{border:none;border-top:1px solid var(--border);margin:16px 0;}
.md-out table{width:100%;border-collapse:collapse;margin-bottom:12px;}
.md-out th{background:var(--surface2);padding:7px 11px;text-align:left;font-weight:600;border:1px solid var(--border);font-size:.8rem;}
.md-out td{padding:6px 11px;border:1px solid var(--border);font-size:.83rem;}

/* TOAST */
.toast{position:fixed;bottom:20px;right:20px;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:10px 18px;border-radius:9px;font-size:.8rem;opacity:0;transition:opacity .3s;z-index:999;box-shadow:0 6px 24px rgba(0,0,0,.3);}
.toast.visible{opacity:1;}
.toast.success{border-color:var(--success);}
.toast.error{border-color:var(--danger);}
</style>
</head>
<body>

<header>
  <div class="logo"><div class="logo-dot"></div>EXAM.PREP</div>
  <button class="hbtn" onclick="toggleTheme()" id="themeBtn">☀ LYS</button>
</header>

<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="slabel">// fag</div>
      <div class="sub-list">
        <button class="sub-btn active" onclick="selectSubject(this,'Programmering')">
          <span class="sub-icon">💻</span> Programmering
          <span class="sub-count" id="cnt-0">0</span>
        </button>
        <button class="sub-btn" onclick="selectSubject(this,'Forretningsforståelse')">
          <span class="sub-icon">📊</span> Forretningsforståelse
          <span class="sub-count" id="cnt-1">0</span>
        </button>
        <button class="sub-btn" onclick="selectSubject(this,'Computerarkitektur')">
          <span class="sub-icon">🖥</span> Computerarkitektur
          <span class="sub-count" id="cnt-2">0</span>
        </button>
      </div>
    </div>

    <div class="sidebar-docs" id="sidebarDocs">
      <div class="upload-zone" id="uploadZone"
        ondragover="event.preventDefault();this.classList.add('dragover')"
        ondragleave="this.classList.remove('dragover')"
        ondrop="handleDrop(event)">
        <input type="file" id="fileInput" multiple accept=".pdf,.pptx,.ppt,.docx,.doc,.txt,.md" onchange="handleFiles(this.files)">
        <div class="uz-icon">📂</div>
        <div class="uz-text">Træk filer hertil eller <strong>klik</strong></div>
      </div>
      <div class="doc-items" id="docItems">
        <div class="empty-docs">Ingen dokumenter endnu</div>
      </div>
    </div>

    <div class="sidebar-saved">
      <div class="slabel" style="margin-bottom:8px;">// gemte resultater</div>
      <div class="saved-list" id="savedList">
        <div class="empty-docs" style="padding:8px 0;">Ingen gemte resultater</div>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <div class="main-topbar">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <div class="scope-tabs">
          <button class="scope-btn active" onclick="selectScope(this,'all')" id="scopeAll">📚 Alle filer</button>
          <button class="scope-btn" onclick="selectScope(this,'single')" id="scopeSingle">📄 Enkelt fil</button>
        </div>
        <div class="stats-pill" id="statsPill"><span>0</span> dokumenter</div>
      </div>
      <div class="mode-tabs">
        <button class="mode-btn active" onclick="selectMode(this,'quiz')">🎯 Quiz</button>
        <button class="mode-btn" onclick="selectMode(this,'summary')">📋 Opsummering</button>
        <button class="mode-btn" onclick="selectMode(this,'explain')">💡 Forklaring</button>
      </div>
    </div>

    <div class="main-body">
      <div class="controls-row" id="controlsRow">
        <!-- Quiz controls -->
        <div class="ctrl-group" id="quizCtrls">
          <span class="ctrl-label">Antal:</span>
          <input type="number" class="ctrl-num" id="numQ" value="5" min="1" max="20">
          <span class="ctrl-label">Type:</span>
          <select class="ctrl-select" id="qType">
            <option value="multiple">Multiplechoice</option>
            <option value="open">Åbne spørgsmål</option>
            <option value="truefalse">Sandt/Falsk</option>
          </select>
        </div>
        <!-- Topic input for explain -->
        <input type="text" class="topic-input" id="topicInput" placeholder="Skriv emne at forklare (fx 'OOP', 'OSI-modellen', 'Loops')..." style="display:none;">
        <!-- Scope info -->
        <div class="scope-info" id="scopeInfo" style="display:none;">📄 Enkelt fil valgt</div>
        <button class="gen-btn" id="genBtn" onclick="generate()">⚡ GENERÉR</button>
      </div>

      <div class="loading-bar" id="loading">
        <div class="spinner"></div>
        <div class="loading-txt" id="loadingTxt">GENERERER...</div>
      </div>

      <div class="output-wrap" id="outputWrap">
        <div class="output-header">
          <div class="output-label" id="outputLabel">// resultat</div>
          <div class="output-btns">
            <button class="obtn save" onclick="saveResult()">💾 Gem</button>
            <button class="obtn" onclick="copyOutput()">📋 Kopiér</button>
          </div>
        </div>
        <div id="outputContent"></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const SUPABASE_URL = 'https://ojpmrfhtepdvdinoixvs.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9qcG1yZmh0ZXBkdmRpbm9peHZzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2Nzc2OTEsImV4cCI6MjA5MTI1MzY5MX0.f0bRsu4fddPnOgBRsEtwO3MgSMOvQ6ypxEjtUoWHeGg';

const SUBJECTS = ['Programmering','Forretningsforståelse','Computerarkitektur'];
let theme = 'dark';
let currentSubject = 'Programmering';
let currentMode = 'quiz';
let currentScope = 'all'; // 'all' or 'single'
let selectedDocId = null;
let currentOutput = '';
let allDocs = {};
let allSaved = {};

window.addEventListener('load', loadData);

// ── THEME ──────────────────────────────────────────────────
function toggleTheme() {
  theme = theme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', theme === 'light' ? 'light' : '');
  document.getElementById('themeBtn').textContent = theme === 'dark' ? '☀ LYS' : '🌙 MØRK';
}

// ── SUBJECT ────────────────────────────────────────────────
function selectSubject(btn, name) {
  document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentSubject = name;
  selectedDocId = null;
  document.getElementById('outputWrap').classList.remove('visible');
  renderDocs();
  renderSaved();
  updateStats();
}

// ── SCOPE ──────────────────────────────────────────────────
function selectScope(btn, scope) {
  document.querySelectorAll('.scope-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentScope = scope;
  selectedDocId = null;
  document.getElementById('outputWrap').classList.remove('visible');
  document.getElementById('scopeInfo').style.display = 'none';
  renderDocs();
  updateStats();
}

// ── MODE ───────────────────────────────────────────────────
function selectMode(btn, mode) {
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentMode = mode;
  document.getElementById('quizCtrls').style.display = mode === 'quiz' ? 'flex' : 'none';
  document.getElementById('topicInput').style.display = mode === 'explain' ? 'block' : 'none';
  document.getElementById('outputWrap').classList.remove('visible');
}

// ── SUPABASE ───────────────────────────────────────────────
async function sb(path, opts = {}) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...opts,
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation',
      ...opts.headers
    }
  });
  if (!r.ok) throw new Error(await r.text());
  const t = await r.text();
  return t ? JSON.parse(t) : [];
}

// ── LOAD ───────────────────────────────────────────────────
async function loadData() {
  try {
    for (let i = 0; i < SUBJECTS.length; i++) {
      const s = SUBJECTS[i];
      allDocs[s] = await sb(`documents?subject=eq.${encodeURIComponent(s)}&order=created_at.asc`);
      allSaved[s] = await sb(`generated_content?subject=eq.${encodeURIComponent(s)}&order=created_at.desc`);
      document.getElementById(`cnt-${i}`).textContent = allDocs[s].length;
    }
    renderDocs();
    renderSaved();
    updateStats();
  } catch(e) { showToast('Fejl ved indlæsning: ' + e.message, 'error'); }
}

// ── FILES ──────────────────────────────────────────────────
function handleDrop(e) {
  e.preventDefault();
  document.getElementById('uploadZone').classList.remove('dragover');
  handleFiles(e.dataTransfer.files);
}

async function handleFiles(files) {
  for (const file of files) {
    const ext = file.name.split('.').pop().toLowerCase();
    let text = '';
    try {
      if (ext === 'pdf') text = await readPDF(file);
      else if (['docx','doc'].includes(ext)) text = await readDOCX(file);
      else if (['pptx','ppt'].includes(ext)) text = await readPPTX(file);
      else if (['txt','md'].includes(ext)) text = await readTxt(file);
      else { showToast('Ukendt type: ' + file.name, 'error'); continue; }
      if (!text || text.length < 10) { showToast('Ingen tekst: ' + file.name, 'error'); continue; }

      const res = await sb('documents', {
        method: 'POST',
        body: JSON.stringify({ subject: currentSubject, filename: file.name, content: text })
      });
      if (!allDocs[currentSubject]) allDocs[currentSubject] = [];
      allDocs[currentSubject].push(res[0]);
      const idx = SUBJECTS.indexOf(currentSubject);
      document.getElementById(`cnt-${idx}`).textContent = allDocs[currentSubject].length;
      renderDocs();
      updateStats();
      showToast('✓ ' + file.name, 'success');
    } catch(e) { showToast('Fejl: ' + e.message, 'error'); }
  }
}

async function readPDF(file) {
  const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  let t = '';
  for (let i = 1; i <= pdf.numPages; i++) {
    const p = await pdf.getPage(i);
    const c = await p.getTextContent();
    t += c.items.map(x => x.str).join(' ') + '\n';
  }
  return t.trim();
}
async function readDOCX(file) {
  return (await mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() })).value.trim();
}
async function readPPTX(file) {
  const zip = await JSZip.loadAsync(await file.arrayBuffer());
  const slides = Object.keys(zip.files).filter(n => n.match(/^ppt\/slides\/slide\d+\.xml$/)).sort((a,b)=>parseInt(a.match(/\d+/)?.[0]||0)-parseInt(b.match(/\d+/)?.[0]||0));
  let t = '';
  for (const s of slides) {
    const xml = await zip.files[s].async('text');
    const st = (xml.match(/<a:t[^>]*>([^<]+)<\/a:t>/g)||[]).map(m=>m.replace(/<[^>]+>/g,'')).join(' ').trim();
    if (st) t += st + '\n';
  }
  return t.trim();
}
async function readTxt(file) {
  return new Promise((res,rej) => { const r = new FileReader(); r.onload = e => res(e.target.result); r.onerror = rej; r.readAsText(file); });
}

// ── DELETE ─────────────────────────────────────────────────
async function deleteDoc(id) {
  try {
    await sb(`documents?id=eq.${id}`, { method: 'DELETE' });
    allDocs[currentSubject] = allDocs[currentSubject].filter(d => d.id !== id);
    const idx = SUBJECTS.indexOf(currentSubject);
    document.getElementById(`cnt-${idx}`).textContent = allDocs[currentSubject].length;
    if (selectedDocId === id) { selectedDocId = null; document.getElementById('scopeInfo').style.display = 'none'; }
    renderDocs();
    updateStats();
    showToast('Dokument slettet');
  } catch(e) { showToast('Fejl: ' + e.message, 'error'); }
}
async function deleteSaved(id) {
  try {
    await sb(`generated_content?id=eq.${id}`, { method: 'DELETE' });
    allSaved[currentSubject] = allSaved[currentSubject].filter(s => s.id !== id);
    renderSaved();
    showToast('Slettet');
  } catch(e) { showToast('Fejl: ' + e.message, 'error'); }
}

// ── SELECT DOC (enkelt fil mode) ───────────────────────────
function selectDoc(id) {
  if (currentScope !== 'single') return;
  selectedDocId = selectedDocId === id ? null : id;
  renderDocs();
  const doc = (allDocs[currentSubject]||[]).find(d => d.id === id);
  const info = document.getElementById('scopeInfo');
  if (selectedDocId && doc) {
    info.textContent = `📄 ${doc.filename}`;
    info.style.display = 'block';
  } else {
    info.style.display = 'none';
  }
}

// ── RENDER DOCS ────────────────────────────────────────────
function renderDocs() {
  const docs = allDocs[currentSubject] || [];
  const el = document.getElementById('docItems');
  if (!docs.length) { el.innerHTML = '<div class="empty-docs">Ingen dokumenter endnu</div>'; return; }
  const icons = {pdf:'📄',pptx:'📊',ppt:'📊',docx:'📝',doc:'📝',txt:'📃',md:'📃'};
  el.innerHTML = docs.map(d => {
    const ext = d.filename.split('.').pop().toLowerCase();
    const size = ((d.content?.length||0)/1000).toFixed(1) + 'k';
    const date = new Date(d.created_at).toLocaleDateString('da-DK',{day:'numeric',month:'short'});
    const isSelected = currentScope === 'single' && selectedDocId === d.id;
    const clickable = currentScope === 'single' ? `onclick="selectDoc('${d.id}')"` : '';
    return `<div class="doc-card${isSelected?' selected':''}" ${clickable}>
      <span class="doc-icon">${icons[ext]||'📁'}</span>
      <div class="doc-info">
        <div class="doc-name" title="${d.filename}">${d.filename}</div>
        <div class="doc-meta">${size} tegn · ${date}</div>
      </div>
      <button class="doc-del" onclick="event.stopPropagation();deleteDoc('${d.id}')">✕</button>
    </div>`;
  }).join('');
}

// ── RENDER SAVED ───────────────────────────────────────────
function renderSaved() {
  const saved = allSaved[currentSubject] || [];
  const el = document.getElementById('savedList');
  if (!saved.length) { el.innerHTML = '<div class="empty-docs" style="padding:8px 0;">Ingen gemte resultater</div>'; return; }
  const icons = {quiz:'🎯',summary:'📋',explain:'💡'};
  const labels = {quiz:'Quiz',summary:'Opsummering',explain:'Forklaring'};
  el.innerHTML = saved.map(s => {
    const date = new Date(s.created_at).toLocaleDateString('da-DK',{day:'numeric',month:'short'});
    const sub = s.scope_filename ? `📄 ${s.scope_filename}` : '📚 Alle filer';
    return `<div class="saved-card" onclick="showSaved('${s.id}')">
      <span class="saved-card-icon">${icons[s.type]||'📄'}</span>
      <div class="saved-card-info">
        <div class="saved-card-type">${labels[s.type]||s.type} · ${date}</div>
        <div class="saved-card-sub">${sub}</div>
      </div>
      <button class="saved-del" onclick="event.stopPropagation();deleteSaved('${s.id}')">✕</button>
    </div>`;
  }).join('');
}

function showSaved(id) {
  const s = (allSaved[currentSubject]||[]).find(x => x.id === id);
  if (!s) return;
  currentOutput = s.content;
  currentMode = s.type;
  const labels = {quiz:'// quiz spørgsmål',summary:'// opsummering',explain:'// forklaring'};
  document.getElementById('outputLabel').textContent = labels[s.type] || '// resultat';
  renderOutput(s.content);
  document.getElementById('outputWrap').classList.add('visible');
}

// ── STATS ──────────────────────────────────────────────────
function updateStats() {
  const docs = allDocs[currentSubject] || [];
  const total = docs.reduce((s,d) => s + (d.content?.length||0), 0);
  const el = document.getElementById('statsPill');
  el.innerHTML = `<span>${docs.length}</span> dok · ${(total/1000).toFixed(0)}k tegn`;
}

// ── BUILD PROMPT ───────────────────────────────────────────
function buildPrompt() {
  const docs = allDocs[currentSubject] || [];
  let useDocs = docs;

  // Enkelt fil mode
  if (currentScope === 'single' && selectedDocId) {
    const doc = docs.find(d => d.id === selectedDocId);
    useDocs = doc ? [doc] : [];
  }

  // Byg materiale tekst — ingen hård grænse, AI afkorter selv
  let parts = '';
  for (const d of useDocs) {
    parts += `\n\n--- ${d.filename} ---\n${d.content||''}`;
  }

  const scopeLabel = currentScope === 'single' && selectedDocId
    ? `filen "${useDocs[0]?.filename}"`
    : `alle ${useDocs.length} filer i faget "${currentSubject}"`;

  const mat = parts
    ? `Her er undervisningsmateriale fra ${scopeLabel}:\n${parts}`
    : `Brug din generelle viden om "${currentSubject}".`;

  const n = document.getElementById('numQ').value || 5;
  const qt = document.getElementById('qType').value || 'multiple';
  const topic = document.getElementById('topicInput').value || '';

  if (currentMode === 'quiz') {
    if (qt === 'multiple') return `${mat}\n\n---\nOPGAVE: Lav præcis ${n} multiplechoice spørgsmål på dansk baseret på materialet. HVERT spørgsmål SKAL have en Svar-linje. Start direkte med Q1:\n\nQ1: [spørgsmål]\nA) [svar]\nB) [svar]\nC) [svar]\nD) [svar]\nSvar: A — [forklaring på hvorfor dette er korrekt]\n\nQ2: [spørgsmål]\nA) [svar]\nB) [svar]\nC) [svar]\nD) [svar]\nSvar: C — [forklaring på hvorfor dette er korrekt]\n\nALLE ${n} spørgsmål skal følge præcis dette format med Svar-linjen.`;
    if (qt === 'open') return `${mat}\n\n---\nOPGAVE: Lav præcis ${n} åbne eksamensspørgsmål på dansk. Start direkte med Q1:\n\nQ1: [spørgsmål]\nSvar: [detaljeret svar]\n\nFortsæt til Q${n}.`;
    return `${mat}\n\n---\nOPGAVE: Lav præcis ${n} sandt/falsk påstande på dansk. Start direkte med Q1:\n\nQ1: [påstand]\nSvar: Sandt — [forklaring]\n\nFortsæt til Q${n}.`;
  }
  if (currentMode === 'summary') return `${mat}\n\n---\nOPGAVE: Lav en grundig og struktureret eksamensopsummering på dansk af alt materialet. Tag alle vigtige emner med. Brug overskrifter og punktlister.`;

  const t = topic || `de vigtigste begreber i ${currentSubject}`;
  return `${mat}\n\n---\nOPGAVE: Forklar følgende emne grundigt og pædagogisk på dansk: "${t}". Brug konkrete eksempler fra materialet. Vær tydelig og lærerig.`;
}

// ── GENERATE ───────────────────────────────────────────────
async function generate() {
  const docs = allDocs[currentSubject] || [];
  if (!docs.length) { showToast('Upload mindst ét dokument først!', 'error'); return; }
  if (currentScope === 'single' && !selectedDocId) { showToast('Vælg en fil ved at klikke på den!', 'error'); return; }

  const btn = document.getElementById('genBtn');
  const loading = document.getElementById('loading');
  btn.disabled = true;
  loading.classList.add('visible');
  document.getElementById('outputWrap').classList.remove('visible');
  document.getElementById('loadingTxt').textContent = currentMode === 'quiz' ? 'GENERERER QUIZ...' : currentMode === 'summary' ? 'GENERERER OPSUMMERING...' : 'GENERERER FORKLARING...';

  try {
    const r = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt: buildPrompt(), mode: currentMode })
    });
    const data = await r.json();
    if (data.error) throw new Error(data.error);
    currentOutput = data.text;
    const labels = {quiz:'// quiz spørgsmål',summary:'// opsummering',explain:'// forklaring'};
    document.getElementById('outputLabel').textContent = labels[currentMode] || '// resultat';
    renderOutput(data.text);
    document.getElementById('outputWrap').classList.add('visible');
    document.getElementById('outputWrap').scrollIntoView({ behavior:'smooth', block:'start' });
  } catch(e) {
    document.getElementById('outputContent').innerHTML = `<div class="md-out" style="color:var(--danger)">Fejl: ${e.message}</div>`;
    document.getElementById('outputWrap').classList.add('visible');
  }
  btn.disabled = false;
  loading.classList.remove('visible');
}

// ── SAVE ───────────────────────────────────────────────────
async function saveResult() {
  if (!currentOutput) return;
  try {
    const scopeFilename = currentScope === 'single' && selectedDocId
      ? (allDocs[currentSubject]||[]).find(d => d.id === selectedDocId)?.filename || null
      : null;
    const res = await sb('generated_content', {
      method: 'POST',
      body: JSON.stringify({ subject: currentSubject, type: currentMode, content: currentOutput, scope_filename: scopeFilename })
    });
    if (!allSaved[currentSubject]) allSaved[currentSubject] = [];
    allSaved[currentSubject].unshift(res[0]);
    renderSaved();
    showToast('✓ Gemt!', 'success');
  } catch(e) { showToast('Fejl: ' + e.message, 'error'); }
}

// ── RENDER ─────────────────────────────────────────────────
function renderOutput(text) {
  const el = document.getElementById('outputContent');
  el.innerHTML = currentMode === 'quiz' ? renderQuiz(text) : `<div class="md-out">${renderMD(text)}</div>`;
}

function renderQuiz(text) {
  const blocks = text.split(/\n(?=Q\d+:)/);
  if (blocks.length <= 1) return `<div class="md-out">${renderMD(text)}</div>`;
  return '<div class="quiz-grid">' + blocks.filter(b=>b.trim()).map((block,i) => {
    const lines = block.trim().split('\n');
    const q = lines[0].replace(/^Q\d+:\s*/,'');
    const opts = lines.filter(l => /^[A-D]\)/.test(l.trim()));
    const ans = lines.find(l => /^Svar:/.test(l.trim())) || '';
    let html = `<div class="quiz-card"><div class="quiz-num">SPØRGSMÅL ${i+1}</div><div class="quiz-q">${esc(q)}</div>`;
    if (opts.length > 0) {
      html += '<div class="quiz-opts">' + opts.map(o =>
        `<button class="quiz-opt" onclick="handleAns(this,'${o[0]}',\`${escA(ans)}\`)">${esc(o)}</button>`
      ).join('') + '</div>';
      html += `<div class="quiz-reveal">${esc(ans)}</div>`;
    } else {
      html += `<div class="quiz-reveal visible">${esc(lines.slice(1).join('\n'))}</div>`;
    }
    return html + '</div>';
  }).join('') + '</div>';
}

function handleAns(el, letter, ans) {
  const card = el.closest('.quiz-card');
  if (card.querySelector('.correct,.wrong')) return;
  const m = ans.match(/Svar:\s*([A-D])/);
  const correct = m ? m[1] : null;
  card.querySelectorAll('.quiz-opt').forEach(o => {
    const l = o.textContent.trim()[0];
    if (l === letter && letter !== correct) o.classList.add('wrong');
    if (correct && l === correct) o.classList.add('correct');
    o.disabled = true;
  });
  card.querySelector('.quiz-reveal')?.classList.add('visible');
}

function renderMD(text) {
  return text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/^### (.+)$/gm,'<h3>$1</h3>')
    .replace(/^## (.+)$/gm,'<h2>$1</h2>')
    .replace(/^# (.+)$/gm,'<h1>$1</h1>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/`{3}[\w]*\n?([\s\S]*?)`{3}/g,'<pre><code>$1</code></pre>')
    .replace(/`(.+?)`/g,'<code>$1</code>')
    .replace(/^---$/gm,'<hr>')
    .replace(/^\* (.+)$/gm,'<li>$1</li>')
    .replace(/^- (.+)$/gm,'<li>$1</li>')
    .replace(/^(\d+)\. (.+)$/gm,'<li>$2</li>')
    .replace(/(<li>[\s\S]*?<\/li>)(\n<li>[\s\S]*?<\/li>)*/g, m=>`<ul>${m}</ul>`)
    .replace(/\n\n+/g,'</p><p>')
    .replace(/\n/g,'<br>');
}

function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function escA(t){return String(t).replace(/`/g,'\\`').replace(/\$/g,'\\$');}

function copyOutput() {
  navigator.clipboard.writeText(document.getElementById('outputContent').innerText).then(() => showToast('✓ Kopieret!','success'));
}

function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast visible' + (type ? ' '+type : '');
  setTimeout(() => t.classList.remove('visible'), 2800);
}
</script>
